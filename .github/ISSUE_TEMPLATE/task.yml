name: Tarefa
description: Registre uma tarefa técnica ou de infraestrutura necessária.
title: ""
labels: ["task"]

body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Descreva o objetivo técnico da tarefa e o benefício esperado.
      placeholder: "Como <desenvolvedor>, quero <tarefa>, para que <benefício_técnico>."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      description: Liste condições objetivas e verificáveis para conclusão da tarefa.
      placeholder: |
        - [ ] Item técnico implementado
        - [ ] Verificação realizada com sucesso
    validations:
      required: true

  - type: input
    id: screens
    attributes:
      label: Link das telas ou protótipo
      description: Informe o endereço da documentação ou protótipo associado, caso exista.
      placeholder: "https://www.figma.com/design/..."
    validations:
      required: false

  - type: textarea
    id: observations
    attributes:
      label: Observações
      description: Detalhes de implementação, dependências ou restrições técnicas.
    validations:
      required: false
